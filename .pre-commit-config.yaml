# Fast, dependency-light gates that run on every commit.
#
# CI's automatic triggers are disabled while this repository is private (see
# .github/workflows/ci.yml), so these hooks plus `make check` are the only
# automatic enforcement there is. The slower gates - mypy and the test suite -
# are registered for the pre-push stage and installed separately by
# `make hooks-push`, so committing stays fast while pushing is guarded.
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: trailing-whitespace
        exclude: \.ipynb$
      - id: check-added-large-files
        # Model weights, databases, checkpoints and prediction dumps must never
        # enter git history. .gitignore is the policy; this is the backstop.
        args: [--maxkb=1000]

  # Keep notebooks free of outputs and execution counts: stored results make
  # diffs unreadable and let a stale number look like a current one.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # Registered for pre-push only, and installed by `make hooks-push`.
  # These replace what CI would have caught before code leaves the machine.
  - repo: local
    hooks:
      # `language: system` runs these in whatever environment is active, so
      # activate the project virtualenv (or use `poetry run pre-commit`) before
      # pushing. Hard-coding `poetry run` is worse: it resolves binaries from
      # PATH but `python` from the venv, so the two disagree when the venv is
      # not fully provisioned.
      - id: mypy-strict
        name: mypy --strict
        entry: mypy src/qwen_text2sql scripts
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: notebook-validation
        name: notebooks carry no outputs
        entry: python scripts/validate_notebooks.py
        language: system
        files: \.ipynb$
        pass_filenames: false
        stages: [pre-push]
