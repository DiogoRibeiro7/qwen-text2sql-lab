name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml pytest pytest-cov ruff mypy types-PyYAML nbformat
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src/qwen_text2sql
      - name: Tests
        run: PYTHONPATH=src pytest --cov=qwen_text2sql --cov-report=term-missing
      - name: Notebook static validation
        run: PYTHONPATH=src python scripts/validate_notebooks.py
