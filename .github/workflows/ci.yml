name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a new tool release cannot turn CI red without a deliberate bump.
  # Dependabot proposes updates to these via the pip ecosystem.
  RUFF_VERSION: "0.16.4"
  MYPY_VERSION: "1.20.2"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff==${RUFF_VERSION}"
      - name: Ruff lint
        run: ruff check --output-format=github src tests scripts notebooks
      - name: Ruff format
        run: ruff format --check --diff src tests scripts notebooks

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install typing dependencies
        # matplotlib is installed because qwen_text2sql.reporting.figures is typed
        # against it. The heavy ML stack (torch, transformers, trl, peft) is
        # deliberately not installed: it would dominate CI time and is not needed
        # for the deterministic data/evaluation code. Those imports are lazy and
        # covered by mypy overrides. Run `make typecheck` in a full environment
        # before changing training or inference code.
        run: |
          python -m pip install --upgrade pip
          # NumPy 2.5 stubs use Python 3.12 syntax, while this check targets 3.11.
          python -m pip install "mypy==${MYPY_VERSION}" types-PyYAML pandas-stubs "numpy<2.5" pandas matplotlib "DataExcept>=1.7,<2"
          python -m pip install -e . --no-deps
      - name: Mypy (strict)
        run: mypy src/qwen_text2sql scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # CI never downloads model weights or BIRD databases. Tests build small
        # temporary SQLite databases instead.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyyaml pytest pytest-cov matplotlib "DataExcept>=1.7,<2"
          python -m pip install -e . --no-deps
      - name: Pytest
        run: pytest --cov=qwen_text2sql --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  notebooks:
    name: Notebook validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install notebook tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat
      - name: Static notebook validation
        run: python scripts/validate_notebooks.py

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify the lock file matches pyproject.toml
        # Guards against editing a dependency constraint without re-locking,
        # which would silently break `poetry install` reproducibility.
        run: |
          python -m pip install --upgrade pip poetry
          poetry check --lock
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
