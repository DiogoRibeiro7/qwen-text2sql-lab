name: Feature request
description: Propose a new capability for the codebase.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is currently hard, impossible or unreliable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require redistributing BIRD data or model weights.
          required: true
        - label: This keeps reusable logic in `src/`, not inside notebooks.
          required: true
