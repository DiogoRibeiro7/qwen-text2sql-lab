[project]
name = "qwen-text2sql-lab"
version = "0.1.0"
description = "Reproducible LoRA/QLoRA fine-tuning experiments for Qwen3.5 on text-to-SQL."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Diogo Ribeiro" }]
maintainers = [{ name = "Diogo Ribeiro" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "text-to-sql",
  "qwen",
  "lora",
  "qlora",
  "peft",
  "parameter-efficient-fine-tuning",
  "bird-benchmark",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "datasets>=3.0",
  "transformers>=5.14.1,<6",
  "trl>=0.28,<1",
  "peft>=0.18,<1",
  "accelerate>=1.0",
  "safetensors>=0.5",
  "torch>=2.6",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.46"]
# Required by the notebooks and by qwen_text2sql.reporting.figures.
notebooks = ["matplotlib>=3.8", "ipykernel>=6.29"]

[project.scripts]
qwen-text2sql = "qwen_text2sql.cli:main"

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/qwen-text2sql-lab"
Repository = "https://github.com/DiogoRibeiro7/qwen-text2sql-lab"
Issues = "https://github.com/DiogoRibeiro7/qwen-text2sql-lab/issues"
Changelog = "https://github.com/DiogoRibeiro7/qwen-text2sql-lab/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "qwen_text2sql", from = "src" }]

[tool.poetry.group.quantization.dependencies]
bitsandbytes = ">=0.46"

[tool.poetry.group.notebooks.dependencies]
matplotlib = ">=3.8"
ipykernel = ">=6.29"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.16.4,<0.17"
mypy = ">=1.20.2,<2"
pre-commit = ">=4.0"
nbformat = ">=5.10"
types-PyYAML = ">=6.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["qwen_text2sql"]
warn_unused_ignores = true
warn_redundant_casts = true

# Heavy ML dependencies are not installed in the lightweight CI environment.
# `ignore_missing_imports` keeps that run green, while `implicit_reexport`
# keeps the local run (where the packages *are* installed and ship `py.typed`)
# from failing on names these libraries re-export without declaring.
[[tool.mypy.overrides]]
module = ["datasets.*", "transformers.*", "trl.*", "peft.*", "bitsandbytes.*", "cycler.*"]
ignore_missing_imports = true
implicit_reexport = true

# `peft.prepare_model_for_kbit_training` is untyped upstream. Scoped to the one
# module that calls it so the rest of the package stays fully strict.
[[tool.mypy.overrides]]
module = ["qwen_text2sql.training.modeling"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "slow: tests that are slow enough to exclude from the default fast loop",
  "gpu: tests that require a CUDA device",
]

[tool.coverage.run]
source = ["qwen_text2sql"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
