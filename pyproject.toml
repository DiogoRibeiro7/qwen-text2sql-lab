[tool.poetry]
name = "qwen-text2sql-lab"
version = "0.1.0"
description = "Reproducible LoRA/QLoRA fine-tuning experiments for Qwen3.5 on text-to-SQL."
authors = ["Diogo Ribeiro"]
readme = "README.md"
license = "MIT"
packages = [{ include = "qwen_text2sql", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=2.0"
pandas = ">=2.2"
pyyaml = ">=6.0"
datasets = ">=3.0"
transformers = ">=5.14.1,<6"
trl = ">=0.28,<1"
peft = ">=0.18,<1"
accelerate = ">=1.0"
safetensors = ">=0.5"
torch = ">=2.6"

[tool.poetry.group.quantization.dependencies]
bitsandbytes = ">=0.46"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.12"
mypy = ">=1.15"
pre-commit = ">=4.0"
nbformat = ">=5.10"
types-PyYAML = ">=6.0"

[tool.poetry.scripts]
qwen-text2sql = "qwen_text2sql.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["qwen_text2sql"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["datasets.*", "transformers.*", "trl.*", "peft.*", "bitsandbytes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["qwen_text2sql"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
