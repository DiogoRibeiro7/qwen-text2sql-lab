model:
  model_id: Qwen/Qwen3.5-4B
  max_seq_length: 4096
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0
  trust_remote_code: false

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  use_rslora: false

training:
  output_dir: results/checkpoints/baseline_unused
  epochs: 1.0
  learning_rate: 0.0001
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  warmup_ratio: 0.0
  weight_decay: 0.0
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  seed: 42
  gradient_checkpointing: false
  bf16: true
  fp16: false
  completion_only_loss: true

quantization:
  enabled: false
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
